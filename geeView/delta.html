<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta content="utf-8" http-equiv="encoding" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>geeViz Delta</title>
    <link rel="icon" href="./src/assets/images/geeViz-logo-light.png" />

    <script type="text/javascript">
      var mode = "geeViz";
    </script>

    <!-- Apply the theme before first paint (delta-theme, else the system setting) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("delta-theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-bs-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- Google Maps API -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBGYMetcutixj0RwQG838jzqnS4ZK-6jeQ&libraries=places,geometry"></script>

    <!-- Google Earth Engine API -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/google/earthengine-api@0.1.384/javascript/build/ee_api_js.js" integrity="sha384-tVeKMyegigBNslCtw6N8XPV6d0lspVooP+BNun6SrZw5uy4aLRu2ihAeA129D5Lo" crossorigin="anonymous"></script>

    <!-- Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" integrity="sha384-Hl48Kq2HifOWdXEjMsKo6qxqvRLTYqIGbvlENBmkHAxZKIGCXv43H6W1jA671RzC" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Delta styles and compatibility shim -->
    <link rel="stylesheet" href="./delta/css/tokens.css" />
    <link rel="stylesheet" href="./delta/css/delta.css" />
    <script type="text/javascript" src="./delta/js/compat.js"></script>
    <!-- Wind particles, shared with index.html; reads compat.js's layerObj -->
    <script type="text/javascript" src="./src/js/wind-particles.js"></script>

    <!-- Per-session run script (same tag as index.html) -->
    <script type="text/javascript" src="./src/gee/gee-run/runGeeViz.js"></script>
    <script type="module" src="./delta/js/main.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="loadbar" class="loadbar" hidden></div>
    <div id="yearbadge" class="hud yearbadge mono" hidden></div>
    <div id="mtop" class="mtop">
      <button class="ib mlogo-btn" id="mlogo-btn" title="Theme and about"><img class="logo-img" alt="geeViz menu" /></button>
      <button class="ib" data-act="locate" title="Go to my location"><i class="ti ti-current-location"></i></button>
      <input data-role="search" placeholder="Search places" aria-label="Search places" />
      <button class="ib" data-act="prev-view" title="Previous view"><i class="ti ti-chevron-left"></i></button>
      <button class="ib" data-act="next-view" title="Next view"><i class="ti ti-chevron-right"></i></button>
    </div>
    <div id="mmenu" class="mmenu">
      <div class="mm-h">Theme</div>
      <button data-t="system"><i class="ti ti-device-mobile"></i>Match phone</button>
      <button data-t="light"><i class="ti ti-sun"></i>Light</button>
      <button data-t="dark"><i class="ti ti-moon"></i>Dark</button>
    </div>
    <div id="mplayer" class="mplayer" role="group" aria-label="Timelapse player">
      <span class="tl-year mono"></span>
      <button class="tlb" type="button" data-tl="back" title="Back one frame" aria-label="Back one frame"><i class="ti ti-player-skip-back"></i></button>
      <button class="tlb" type="button" data-tl="play" title="Play" aria-label="Play or pause"><i class="ti ti-player-play"></i></button>
      <button class="tlb" type="button" data-tl="forward" title="Forward one frame" aria-label="Forward one frame"><i class="ti ti-player-skip-forward"></i></button>
    </div>
    <nav id="mtabs" class="mtabs">
      <button data-m="layers"><i class="ti ti-stack-2"></i>Layers</button>
      <button data-m="tools"><i class="ti ti-tools"></i>Tools</button>
    </nav>

    <button id="hamburger-float" class="ib floating-hb" title="Show sidebar"><i class="ti ti-menu-2"></i></button>

    <aside id="pane-left" class="pane pane-left">
      <div class="brand">
        <button id="hamburger" class="ib" title="Hide sidebar"><i class="ti ti-menu-2"></i></button>
        <img class="logo-img" alt="" />
        <span class="name" id="title">geeViz <b>Delta</b></span>
        <button id="theme-btn" class="ib" title="Switch light or dark"><i class="ti ti-sun"></i></button>
      </div>
      <div class="search">
        <button class="ib" data-act="locate" title="Go to my location"><i class="ti ti-current-location"></i></button>
        <input data-role="search" placeholder="Search places or coordinates" aria-label="Search places" />
        <span class="div"></span>
        <button class="ib" data-act="prev-view" title="Previous view"><i class="ti ti-chevron-left"></i></button>
        <button class="ib" data-act="next-view" title="Next view"><i class="ti ti-chevron-right"></i></button>
      </div>
      <div class="scroll" id="layers-mount"></div>
      <div class="grip" data-side="left"></div>
    </aside>

    <aside id="pane-right" class="pane pane-right">
      <div class="tools" role="group" aria-label="Tools" title="Click the active tool again to turn it off">
        <button class="tool" data-tool="distance"><i class="ti ti-ruler-measure"></i>Distance</button>
        <button class="tool" data-tool="area"><i class="ti ti-ruler-2"></i>Area</button>
        <button class="tool" data-tool="query"><i class="ti ti-crosshair"></i>Query</button>
        <button class="tool" data-tool="chart"><i class="ti ti-chart-area-line"></i>Chart area</button>
      </div>
      <div class="units"><span class="lbl">Units</span><div class="seg" role="group" aria-label="Units"><button type="button" data-u="metric">Metric</button><button type="button" data-u="imperial">Imperial</button></div></div>
      <div id="tool-options" class="topt"></div>
      <div class="out-h"><i class="ti ti-list-details"></i>Output <span class="spin" id="out-busy" title="Querying" hidden></span><span class="where mono" id="where"></span></div>
      <div class="chips" id="chips"></div>
      <div class="scroll" id="results-mount"></div>
      <div class="grip" data-side="right"></div>
    </aside>

    <div class="mapctl" id="mapctl">
      <div class="ctlgrp">
        <button class="ib" data-act="zoom-in" title="Zoom in"><i class="ti ti-plus"></i></button>
        <button class="ib" data-act="zoom-out" title="Zoom out"><i class="ti ti-minus"></i></button>
        <button class="ib" data-act="fullscreen" title="Full screen"><i class="ti ti-maximize"></i></button>
        <button class="ib" id="svBtn" title="Street View: show coverage, then click where to look"><i class="ti ti-walk"></i></button>
      </div>
      <div class="basemaps">
        <button class="bm on" data-bm="satellite"><i style="background-image: url(https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/9/196/98)"></i>Satellite</button>
        <button class="bm" data-bm="map"><i style="background-image: url(https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/9/196/98)"></i>Map</button>
        <button class="bm" data-bm="dark"><i style="background-image: url(https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/9/196/98)"></i>Dark</button>
      </div>
    </div>

    <div id="status" class="hud status"></div>
    <div id="tpl">
      <template id="tpl-layer-row">
        <div class="layer">
          <div class="lrow">
            <button class="tgl" type="button" aria-pressed="true"></button>
            <span class="lname"></span>
            <span class="spin" title="Loading tiles" hidden></span>
            <div class="opacity"><input class="dz op" type="range" min="0" max="100" step="1" value="100" aria-label="Opacity" /></div>
            <button class="legbtn none" type="button" title="Show or hide legend" tabindex="-1"><span class="lsw"></span><i class="ti ti-chevron-down"></i></button>
          </div>
          <div class="legend"></div>
        </div>
      </template>
      <template id="tpl-timelapse">
        <div class="tl" title="Time lapse layers load one map layer per frame. Once loaded, play them as an animation or step through single frames. Cumulative shows this frame and all frames before it.">
          <div class="tl-body">
            <div class="tl-top">
              <span class="tl-year mono"></span>
              <span class="tl-transport">
                <button class="tlb" type="button" data-tl="back" title="Back one frame" aria-label="Back one frame"><i class="ti ti-player-skip-back"></i></button>
                <button class="tlb" type="button" data-tl="pause" title="Pause" aria-label="Pause"><i class="ti ti-player-pause"></i></button>
                <button class="tlb" type="button" data-tl="stop" title="Clear animation" aria-label="Clear animation" hidden><i class="ti ti-player-stop"></i></button>
                <button class="tlb" type="button" data-tl="play" title="Play" aria-label="Play"><i class="ti ti-player-play"></i></button>
                <button class="tlb" type="button" data-tl="forward" title="Forward one frame" aria-label="Forward one frame"><i class="ti ti-player-skip-forward"></i></button>
                <button class="tlb" type="button" data-tl="refresh" title="Reload tiles that failed" aria-label="Reload tiles that failed"><i class="ti ti-refresh"></i></button>
                <button class="tlb" type="button" data-tl="frames" title="Show or hide frames" aria-label="Show or hide frames" hidden><i class="ti ti-eye"></i></button>
              </span>
              <button class="tl-cum" type="button" data-tl="cumulative" title="Show every year up to this one stacked together" aria-label="Cumulative" aria-pressed="false"><svg class="tl-cum-ic" data-state="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16" stroke-width="1.5" opacity=".35"/><path d="M4 7v10M8 7v10M12 7v10M20 7v10" stroke-width="2" opacity=".35"/><path d="M16 7v10" stroke-width="2.25"/></svg><svg class="tl-cum-ic" data-state="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 12h4" stroke-width="1.5" opacity=".35"/><path d="M20 7v10" stroke-width="2" opacity=".35"/><path d="M4 12h12" stroke-width="2"/><path d="M4 7v10M8 7v10M12 7v10M16 7v10" stroke-width="2.25"/></svg><span>Cumulative</span></button>
            </div>
            <div class="tl-sl">
              <div class="tl-row"><span class="tl-lbl">Year</span><input class="dz orange" data-tl="year" type="range" min="0" max="0" step="1" value="0" aria-label="Frame" /></div>
              <div class="tl-row"><span class="tl-lbl mono" data-tl="speedv"></span><input class="dz orange" data-tl="speed" type="range" min="0.5" max="3" step="0.5" value="1.5" aria-label="Speed in frames per second" /></div>
            </div>
          </div>
          <div class="tl-frames"></div>
        </div>
      </template>
    </div>
  </body>
</html>
